<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #333; background-color: #f4f6f7; display: flex; justify-content: center; align-items: center; height: 90vh; }
        .register-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .helptext { display: block; font-size: 0.8em; color: #7f8c8d; margin-top: 4px; }
        .btn-register { background: #2ecc71; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1em; margin-top: 15px; }
        .btn-register:hover { background: #27ae60; }
        .errorlist { color: #721c24; background: #f8d7da; padding: 10px 20px; border-radius: 4px; font-size: 0.85em; margin-bottom: 15px; list-style-position: inside; }
        .login-link { text-align: center; margin-top: 20px; font-size: 0.9em; }
        .login-link a { color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="register-container">
    <h2>Registro de Nuevo Usuario</h2>

    <form method="POST">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="errorlist">
                <strong>Por favor, corrige los siguientes errores:</strong>
                {{ form.errors }}
            </div>
        {% endif %}

        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <span class="helptext">{{ field.help_text|safe }}</span>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn-register">Crear Cuenta e Ingresar</button>
    </form>

    <div class="login-link">
        ¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>
    </div>
</div>

</body>
</html>
