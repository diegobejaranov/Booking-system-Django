<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Reserva</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #333; }
        h1 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .form-container { max-width: 500px; margin-top: 20px; background: #f9f9f9; padding: 30px; border-radius: 8px; border: 1px solid #eee; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .form-group input[type="checkbox"] { width: auto; }
        .btn-submit { background: #2ecc71; color: white; padding: 12px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1em; }
        .btn-submit:hover { background: #27ae60; }
        .error-box { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 15px; border-radius: 4px; margin-bottom: 20px; list-style: none; }
        .btn-back { display: inline-block; margin-bottom: 20px; color: #7f8c8d; text-decoration: none; }
    </style>
</head>
<body>

    <a href="{% url 'lista_recursos' %}" class="btn-back">⬅️ Volver al inicio</a>

    <h1>Solicitar Nueva Reserva</h1>

    <div class="form-container">
        {% if form.non_field_errors %}
            <div class="error-box">
                {% for error in form.non_field_errors %}
                    <strong>⚠️ Error:</strong> {{ error }}
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %} 
            
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <span style="color: #721c24; font-size: 0.85em;">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-submit">Confirmar Reserva</button>
        </form>
    </div>

</body>
</html>
