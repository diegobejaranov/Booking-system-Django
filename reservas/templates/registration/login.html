<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #333; background-color: #f4f6f7; display: flex; justify-content: center; align-items: center; height: 80vh; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #34495e; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-login { background: #3498db; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1em; }
        .btn-login:hover { background: #2980b9; }
        .error-msg { color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; padding: 12px; border-radius: 4px; text-align: center; margin-bottom: 20px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Ingresar al Sistema</h2>

    {% if form.errors %}
        <div class="error-msg">⚠️ Usuario o contraseña incorrectos.</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Nombre de usuario:</label>
            <input type="text" name="username" id="id_username" required autofocus>
        </div>
        <div class="form-group">
            <label for="id_password">Contraseña:</label>
            <input type="password" name="password" id="id_password" required>
        </div>
        <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>
</div>

</body>
</html>
